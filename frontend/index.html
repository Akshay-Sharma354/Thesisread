<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEBI Filing Intelligence</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SEBI Filing Intelligence</h1>
    <p class="tagline">Every filing, explained - and compared against everything that came before it.</p>
  </header>

  <main>
    <section id="submit-panel">
      <h2>Analyze a filing</h2>
      
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="text-tab">Paste Text</button>
        <button class="tab-btn" data-tab="file-tab">Upload File</button>
        <button class="tab-btn" data-tab="csv-tab">Upload CSV</button>
      </div>

      <!-- Text input tab -->
      <div id="text-tab" class="tab-content active">
        <form id="filing-form">
          <div class="row">
            <input type="text" id="company_name" placeholder="Company name" required />
            <input type="text" id="ticker" placeholder="Ticker (e.g. INFY)" required />
          </div>
          <textarea id="raw_text" rows="8" placeholder="Paste the filing text here..." required></textarea>
          <button type="submit">Analyze</button>
        </form>
        <div id="analyze-status"></div>
      </div>

      <!-- File upload tab -->
      <div id="file-tab" class="tab-content">
        <form id="file-form">
          <div class="row">
            <input type="text" id="file_company_name" placeholder="Company name" required />
            <input type="text" id="file_ticker" placeholder="Ticker (e.g. INFY)" required />
          </div>
          <input type="file" id="filing_file" accept=".pdf,.docx,.txt" required />
          <button type="submit">Upload & Analyze</button>
        </form>
        <div id="file-status"></div>
      </div>

      <!-- CSV upload tab -->
      <div id="csv-tab" class="tab-content">
        <p style="font-size: 0.9rem; color: #8B93A3; margin-bottom: 1rem;">
          CSV format: company_name, ticker, filing_text, filed_at
        </p>
        <input type="file" id="csv_file" accept=".csv" required />
        <button id="csv-submit" type="button">Upload CSV</button>
        <div id="csv-status"></div>
      </div>
    </section>

    <section id="feed-panel">
      <div class="feed-header">
        <h2>Alert feed</h2>
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="feed"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
